name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Some lockfiles reference github:owner/repo deps, which npm fetches over
      # SSH; runners have no SSH key, so use HTTPS instead.
      - name: Fetch git-hosted deps over HTTPS
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # CRA treats warnings as errors when CI=true; existing lint warnings
          # would fail the build.
          CI: false

      # Serve index.html for unknown paths (client-side routing), matching the
      # old Amplify 404-200 rewrite.
      - name: SPA fallback
        run: cp build/index.html build/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
